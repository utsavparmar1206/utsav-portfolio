name: Apply mobile portfolio layout fix

on:
  push:
    paths:
      - '.github/workflows/apply-mobile-layout-fix.yml'

permissions:
  contents: write

jobs:
  fix-mobile-layout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply mobile-only CSS fix
        shell: python
        run: |
          from pathlib import Path
          import re

          css_path = Path('styles.css')
          css = css_path.read_text()
          start = '/* MOBILE HERO FIX 2026-08-19 */'
          end = '/* END MOBILE HERO FIX 2026-08-19 */'
          css = re.sub(re.escape(start) + r'.*?' + re.escape(end), '', css, flags=re.S)
          fix = r'''
/* MOBILE HERO FIX 2026-08-19 */
@media (max-width:620px){
  .hero{
    padding-top:34px;
    overflow:hidden;
  }
  .hero-grid{
    gap:30px;
  }
  .hero-copy{
    width:100%;
  }
  .hero-copy h1{
    font-size:clamp(2.75rem,14vw,4.25rem);
    line-height:.91;
    max-width:100%;
    margin-bottom:22px;
  }
  .hero-copy h1 .thin{
    font-size:.24em;
    margin:12px 0 9px;
  }
  .hero-lead{
    font-size:.98rem;
    line-height:1.65;
  }
  .hero-actions{
    margin-top:24px;
  }
  .hero-actions .btn{
    min-height:48px;
  }
  .hero-meta{
    gap:8px;
    margin-top:22px;
  }
  .hero-meta span{
    padding:7px 11px;
    font-size:.76rem;
  }

  .hero-portrait{
    width:100%;
    margin-top:4px;
    padding:0 3px 84px;
  }
  .portrait-stage{
    width:100%;
    max-width:440px;
    aspect-ratio:1/1.06;
    padding:10px;
    border-radius:28px;
    margin-inline:auto;
  }
  .portrait-stage::before{
    border-radius:29px;
  }
  .portrait-stage::after{
    inset:14px;
    border-radius:21px;
  }
  .portrait-frame{
    border-radius:21px;
  }
  .portrait-frame img{
    object-fit:cover;
    object-position:center 38%;
  }
  .portrait-overlay{
    inset:10px;
    border-radius:21px;
    background:linear-gradient(180deg,transparent 68%,rgba(3,9,18,.76) 98%);
  }
  .portrait-title{
    left:24px;
    bottom:22px;
    line-height:.88;
  }
  .portrait-title span{
    font-size:.68rem;
    letter-spacing:.34em;
  }
  .portrait-title strong{
    font-size:clamp(1.9rem,9vw,2.5rem);
    max-width:calc(100vw - 74px);
  }

  .floating-stat{
    top:auto!important;
    bottom:-70px!important;
    width:calc(50% - 6px);
    min-width:0;
    padding:11px 12px;
    border-radius:15px;
    animation:none!important;
    transform:none!important;
  }
  .stat-one{
    left:0!important;
    right:auto!important;
  }
  .stat-two{
    right:0!important;
    left:auto!important;
  }
  .floating-stat strong{
    font-size:1.28rem;
    line-height:1.05;
  }
  .floating-stat span{
    margin-top:4px;
    font-size:.68rem;
    line-height:1.35;
  }

  .marquee{
    margin-top:12px;
  }
}

@media (max-width:390px){
  .brand-text strong{font-size:.78rem}
  .brand-text small{font-size:.61rem}
  .brand-symbol{width:39px;height:39px}
  .portrait-stage{aspect-ratio:1/1.08}
  .portrait-title strong{font-size:1.82rem}
  .floating-stat strong{font-size:1.16rem}
  .floating-stat span{font-size:.63rem}
}
/* END MOBILE HERO FIX 2026-08-19 */
'''
          css_path.write_text(css.rstrip() + '\n\n' + fix.strip() + '\n')

          index_path = Path('index.html')
          html = index_path.read_text()
          html = re.sub(r'href="styles\.css(?:\?[^\"]*)?"', 'href="styles.css?v=20260819-mobile-fix1"', html)
          index_path.write_text(html)

      - name: Remove one-time workflow and publish
        run: |
          rm .github/workflows/apply-mobile-layout-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css index.html .github/workflows/apply-mobile-layout-fix.yml
          git commit -m "Fix mobile hero portrait layout"
          git push
